name: APK Derle

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/foss/release/*.apk out/HizliTop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HizliTop
          path: out/HizliTop.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hızlı Top (derleme ${{ github.run_number }})
          files: out/HizliTop.apk
          make_latest: true
